[project]
name = "tao-scout"
version = "0.1.0"
description = "Strictly local, strictly read-only Bittensor subnet intelligence dashboard."
readme = { file = "README.adoc", content-type = "text/plain" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TAO-Scout" }]
keywords = ["bittensor", "subnet", "research", "read-only"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "typer>=0.12",
    "structlog>=24.1",
    "httpx>=0.27",
    "bittensor>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
tao-scout = "tao_scout.cli.main:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tao_scout"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false

[[tool.mypy.overrides]]
module = "tao_scout.scoring.*"
strict = true

[[tool.mypy.overrides]]
module = "tao_scout.safety"
strict = true

[[tool.mypy.overrides]]
module = "tao_scout.config"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/tao_scout"]
omit = ["src/tao_scout/web/*", "src/tao_scout/cli/main.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
